<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Soban Ali — AI full-stack engineer and final-year CS student at FAST NUCES. Multi-agent systems, RAG pipelines, and research replications that beat their baselines." />
    <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)" />
    <!-- Link previews. The build rewrites these per blog route (see vite.config.ts). -->
    <link rel="canonical" href="https://sobanali.vercel.app/" />
    <meta property="og:site_name" content="Soban Ali" />
    <meta property="og:title" content="Soban Ali — AI Full-Stack Engineer" />
    <meta property="og:description" content="AI full-stack engineer and final-year CS student at FAST NUCES. Multi-agent systems, RAG pipelines, and research replications that beat their baselines." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sobanali.vercel.app/" />
    <meta property="og:image" content="https://sobanali.vercel.app/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soban Ali — AI Full-Stack Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sobanali256" />
    <title>Soban Ali — AI Full-Stack Engineer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <!-- Set the theme before first paint so there's no light/dark flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
